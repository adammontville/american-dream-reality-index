name: Deploy site to GitHub Pages

# Publishes the static site under `site/` to GitHub Pages whenever `main`
# changes. Uses the official GitHub Pages actions rather than a `gh-pages`
# branch so the repo layout stays clean:
#
#   docs/  <- source-of-truth Markdown (methodology, notes, sensitivity)
#   site/  <- built static HTML/CSS/JS that this workflow ships to Pages
#
# In the repo Settings, set Pages -> Source to "GitHub Actions" (not
# "Deploy from a branch") once this workflow is on main.
#
# Trigger design:
#
#   push          - human-authored commits to main touching site/** or this
#                   workflow itself redeploy automatically.
#
#   workflow_run  - after Quarterly refresh finishes successfully, this
#                   workflow runs against the just-refreshed main. Needed
#                   because GitHub Actions deliberately does NOT trigger
#                   downstream `push` workflows for commits made by the
#                   default GITHUB_TOKEN (see the Actions docs on
#                   "Triggering a workflow from a workflow"). Without this
#                   trigger, refresh commits would land on main without a
#                   corresponding Pages deploy.
#
#   workflow_dispatch - lets a maintainer force a redeploy from the Actions
#                   tab when needed.

on:
  push:
    branches: [main]
    paths:
      - 'site/**'
      - '.github/workflows/pages.yml'
  workflow_run:
    workflows: ["Quarterly refresh"]
    types: [completed]
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  deploy:
    # Skip the workflow_run trigger's launch when the upstream refresh
    # failed. For push and workflow_dispatch events, github.event.workflow_run
    # is null and the expression is true, so this only gates the
    # workflow_run path.
    if: ${{ github.event_name != 'workflow_run' || github.event.workflow_run.conclusion == 'success' }}
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Configure Pages
        uses: actions/configure-pages@v5

      - name: Upload site/ as Pages artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: site

      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
