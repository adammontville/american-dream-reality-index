name: Deploy site to GitHub Pages

# Publishes the static site under `site/` to GitHub Pages whenever `main`
# changes. Uses the official GitHub Pages actions rather than a `gh-pages`
# branch so the repo layout stays clean:
#
#   docs/  <- source-of-truth Markdown (methodology, notes, sensitivity)
#   site/  <- built static HTML/CSS/JS that this workflow ships to Pages
#
# In the repo Settings, set Pages -> Source to "GitHub Actions" (not
# "Deploy from a branch") once this workflow is on main.

on:
  push:
    branches: [main]
    paths:
      - 'site/**'
      - '.github/workflows/pages.yml'
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Configure Pages
        uses: actions/configure-pages@v5

      - name: Upload site/ as Pages artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: site

      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
